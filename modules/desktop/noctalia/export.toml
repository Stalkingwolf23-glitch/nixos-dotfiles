[plugin_settings."noctalia/screen_recorder"]
directory = "~"
show_cursor = false
video_source = "focused"

[plugins]
enabled = [
    "noctalia/translator",
    "avivbintangaringga/nix-monitor",
    "dotnetrob/cat",
    "noctalia/bongocat",
    "blackbartblues/keymap",
    "noctalia/screen_recorder"
]

    [[plugins.source]]
