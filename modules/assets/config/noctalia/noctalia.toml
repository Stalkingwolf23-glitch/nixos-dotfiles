[noctalia_state]
setup_wizard_completed = true

[notification]
layer = "overlay"
monitors = [ "DP-1" ]
scale = 0.69999999999999996

[osd]
keyboard_layout = false
lock_keys = false
monitors = [ "DP-1" ]
position = "bottom_center"

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/translator" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

[shell]
app_icon_color = "tertiary"
avatar_path = "/home/stalkingwolf/nervi-mornye-far.jpg"
