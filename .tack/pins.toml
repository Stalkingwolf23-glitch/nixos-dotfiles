# tack pins. generated by flake-file write-tack.
# nix reads pins.lock.json; this file drives tack update

[tack]
recomposable = true

[inputs.aagl]
url = "github:ezKEa/aagl-gtk-on-nix"

[inputs.betterfox]
url = "github:yokoffing/Betterfox"
type = "fetch"

[inputs.chaotic]
url = "github:chaotic-cx/nyx/nyxpkgs-unstable"

[inputs.firefox-addons]
url = "gitlab:rycee/nur-expressions"
dir = "pkgs/firefox-addons"

[inputs.flake-file]
url = "github:denful/flake-file"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.gallery-dl]
url = "git+https://codeberg.org/mikf/gallery-dl"
type = "fetch"

[inputs.home-manager]
url = "github:nix-community/home-manager"
follows = { nixpkgs = "nixpkgs" }

[inputs.hyprsplit]
url = "github:shezdy/hyprsplit"
follows = { nixpkgs = "nixpkgs" }

[inputs.kickstart-nixvim]
url = "github:Stalkingwolf23-glitch/kickstart.nixvim"
follows = { flake-parts = "flake-parts", nixpkgs = "nixpkgs", nixvim = "nixvim" }

[inputs.niri]
url = "git+https://codeberg.org/BANanaD3V/niri-nix"
follows = { niri-unstable = "niri-unstable" }

[inputs.niri-screenshare]
url = "github:pantarune/niri-screenshare"
follows = { nixpkgs = "nixpkgs" }

[inputs.niri-unstable]
url = "github:YaLTeR/niri"

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"
follows = { nixpkgs = "nixpkgs" }

[inputs.nixcord]
url = "github:4evy/nixcord"
follows = { flake-parts = "flake-parts", nixpkgs = "nixpkgs" }

[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"

[inputs.nixvim]
url = "github:nix-community/nixvim"
follows = { flake-parts = "flake-parts", nixpkgs = "nixpkgs" }

[inputs.noctalia]
url = "github:noctalia-dev/noctalia/cachix"

[inputs.noctalia-greeter]
url = "github:noctalia-dev/noctalia-greeter"

[inputs.rgd]
url = "github:Rolv-Apneseth/rgd"
type = "fetch"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"
follows = { nixpkgs = "nixpkgs" }

[inputs.tack]
url = "github:manic-systems/tack"

[inputs.zen-browser]
url = "github:0xc000022070/zen-browser-flake/beta"
follows = { home-manager = "home-manager", nixpkgs = "nixpkgs" }
